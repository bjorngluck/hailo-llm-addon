name: "Hailo LLM"
description: "Hailo-10H Model Zoo + Ollama LLM server"
version: "2.0.33"
slug: "hailo_llm"
url: "https://github.com/bjorngluck/hailo-llm-addon"
arch:
  - aarch64
init: false
startup: application
boot: manual
ingress: true
ingress_port: 8000
ingress_entry: /
panel_icon: "mdi:robot"
panel_title: "Hailo LLM"
devices:
  - "/dev/h1x-0"
  - "/dev/hailo0"
full_access: true
privileged: true
apparmor: false
timeout: 300
ports:
  8000/tcp: 8000
map:
  - "media:rw"
  - "addon_config:rw"
  - "homeassistant_config:rw"
  - "ssl"
options:
  keep_alive: "300m"
  auto_download_model: false
schema:
  keep_alive: str
  auto_download_model: bool