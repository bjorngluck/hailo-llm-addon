name: "Hailo LLM"
description: "Hailo-10H Model Zoo + Ollama LLM server"
version: "2.0.41"
slug: "hailo_llm"
url: "https://github.com/bjorngluck/hailo-llm-addon"
arch:
  - aarch64
init: false
startup: application
boot: manual
ingress: true
ingress_port: 8000
ingress_entry: /
panel_icon: "mdi:robot"
panel_title: "Hailo LLM"
devices:
  - "/dev/h1x-0"
  - "/dev/hailo0"
privileged:
  - SYS_RAWIO
apparmor: false
timeout: 300
ports:
  8000/tcp: 8000
  # Native hailo-ollama port (for direct testing, bypassing the nginx/Flask proxy + ingress).
  # After restart, go to Add-on → Network and map a host port (e.g. 11434) if you want
  # to curl the raw /api/chat etc. from outside.
  11434/tcp: 11434
map:
  - "media:rw"
  - "addon_config:rw"
  - "homeassistant_config:rw"
  - "ssl"
options:
  keep_alive: "300m"
  auto_download_model: false
schema:
  keep_alive: str
  auto_download_model: bool